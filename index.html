<script>
const $=i=>document.getElementById(i),X=l=>(l-119.5)*40,Y=t=>(46-t)*52;
const pts=a=>{let s="";for(let i=0;i<a.length;i+=2)s+=X(a[i]).toFixed(1)+","+Y(a[i+1]).toFixed(1)+" ";return s};
const S={};const s=(k,c,r,n)=>S[k]=[c,r,n];
s("Gojoseon","#c2410c","2333 BC–194 BC","Korea’s first kingdom. Tradition dates Dangun’s founding to 2333 BC. It began around Liaodong, then shifted to Pyongyang after pressure from Yan.");
s("Wiman Joseon","#e0592a","194–108 BC","Wiman, a refugee from Yan, took the throne in 194 BC. Han China conquered it in 108 BC.");
s("Han commanderies","#7a7f96","108 BC–313 AD","Han set up Nangnang, Jindun, Imdun and Hyeondo. Nangnang lasted until Goguryeo took it in 313. Daebang split off around 204.");
s("Jin","#9aae5a","c. 300–100 BC","Early southern state. Its heirs were the Samhan confederacies.");
s("Mahan","#7fb069","to c. 369","Largest Samhan confederacy, in the southwest. Baekje grew out of one of its states and absorbed it.");
s("Jinhan","#5fae8e","to c. 356","Southeast confederacy. Saro, one of its states, grew into Silla.");
s("Byeonhan","#b784b5","to 42 AD","South-coast confederacy. Gimhae and neighbors became Gaya.");
s("Gaya","#b05a9c","42–562","Loose federation of city-states (Geumgwan Gaya at Gimhae, later Daegaya). Silla absorbed it by 562.");
s("Buyeo","#e0a526","c. 200 BC–494 AD","Songhua-plain kingdom, parent culture of Goguryeo and Baekje. Jumong left Buyeo and founded Goguryeo at Jolbon. A branch, Eastern Buyeo, split off in the 1st century BC and was destroyed by Goguryeo in AD 22. Buyeo itself fell in 494.");
s("Okjeo","#8a63c4","to c. 56 AD","East-coast tribal state in Hamgyeong, conquered by Goguryeo.");
s("Dongye","#3fb0a4","to c. 300","Eastern coastal people, absorbed by Goguryeo and Silla.");
s("Goguryeo","#3047d1","37 BC–668 AD","Founded by Jumong at Jolbon in 37 BC. The Gyeru clan led the five tribes (Sono, Jeolno, Sunno, Gwanno, Gyeru). It peaked under Gwanggaeto and Jangsu, and fell to Silla and Tang in 668.");
s("Baekje","#2f9e5b","18 BC–660 AD","Founded by Onjo near Hanseong. Peak under Geunchogo (4th c.). Capital moved to Ungjin (475), then Sabi (538). Fell in 660.");
s("Silla","#d9a521","57 BC–935 AD","Began at Saro (Gyeongju). Took the Han River in 551 and Gaya in 562, then unified most of the peninsula in 668. Weakened in the late 9th c., ended in 935.");
s("Tang","#8f949b","618–907","Tang China. Its Andong Protectorate (668–676) ruled former Goguryeo lands until Silla pushed it out. Shown here with Liaoxi and Shandong.");
s("Balhae","#13a3b8","698–926","Founded by Dae Joyeong, a Goguryeo-descended leader. Capital at Sanggyeong. Destroyed by the Khitan Liao in 926.");
s("Later Baekje","#1e7a4b","900–936","Gyeon Hwon’s state in the southwest, capital Wansanju (Jeonju).");
s("Taebong","#6a55d6","901–918","Gungye’s state, called Later Goguryeo, centered on Cheorwon.");
s("Goryeo","#2a9fd6","918–1392","Wang Geon founded it in 918 and reunified the peninsula in 936. Gang Gam-chan’s victory at Gwiju (1019) secured the northern border.");
s("Tamna","#cf6b8a","to 1105","Jeju’s kingdom. It sent tribute to Baekje, Silla and Goryeo, and Goryeo made it a county in 1105. Under Mongol Yuan (1273–1367) Jeju was a horse-breeding base.");
s("Joseon","#e8742a","1392–1897","Founded by Yi Seong-gye in 1392; capital Hanyang. Sejong’s forts fixed the Yalu–Tumen border in the 1430s–40s.");
s("Liao","#a7b0b8","926–1125","Khitan Liao destroyed Balhae and ruled Manchuria. Goryeo repelled its invasions in 993, 1010 and 1018.");
s("Jin ","#a7b0b8","1125–1234","Jurchen Jin overthrew Liao and ruled Manchuria and north China.");
s("Yuan","#a7b0b8","1234–1368","Mongol Yuan took Manchuria and made Goryeo a vassal after 1259.");
s("Ming","#a7b0b8","1368–1644","Ming China held Liaodong. Joseon was its tributary.");
s("Qing","#a7b0b8","1644–1912","Manchu Qing ruled Manchuria and made Joseon a tributary after 1637.");
s("Yan / Qi","#a1887f","c. 400–221 BC","Warring States Yan (north) and Qi (Shandong). Yan seized Liaodong c. 300 BC, pushing Gojoseon east.");
s("Qin–Han","#b8735f","221 BC–220 AD","Qin, then Han, ruled Hebei, Shandong and Liaodong. Han’s commanderies in Korea lay beyond.");
s("Gongsun clan","#c9a26a","189–238","Warlords of Liaodong who set up Daebang and dealt with Goguryeo. Wei destroyed them in 238.");
s("Cao Wei","#6f86a8","220–265","Held Shandong and Hebei, took Liaodong in 238 and attacked Goguryeo in 244.");
s("Western Jin","#8a79b0","265–316","Briefly reunified China but lost the northeast to the Murong Xianbei.");
s("Murong Yan","#c47f9a","285–436","Xianbei Murong states (Former, Later, Northern Yan) in Liaoxi. They fought Goguryeo over Liaodong.");
s("Sixteen Kingdoms","#9a8f7a","316–439","Northern China split into short-lived states. Shandong changed hands often.");

gg, as king in 57 BC. The Seok and Kim clans later joined the throne.","Balhae":"After Goguryeo fell, Dae Joyeong gathered Goguryeo refugees and Mohe tribes, beat Tang at Cheonmun Pass and founded the state in 698.","Later Baekje":"Gyeon Hwon, a Silla commander, rebelled in the southwest and declared Later Baekje in 900.","Taebong":"Gungye, a Silla prince turned rebel, seized Songak and Cheorwon and proclaimed Later Goguryeo in 901.","Goryeo":"Wang Geon, a Songak merchant lord, served Gungye, then replaced him in 918 with other regional lords. He took Silla in 935 and Later Baekje in 936.","Tamna":"Legend says three men, Go, Bu and Yang, rose from the Samseonghyeol cave on Jeju and founded the kingdom.","Joseon":"Yi Seong-gye turned his army back at Wihwado in 1388, took power and was crowned in 1392. Jeong Do-jeon designed the new Confucian state."};

const KDF={"Gojoseon":"نەریت دەڵێت دانگون لە ساڵی 2333 پ.ز. ئاسادالی دامەزراند. لە ڕووی مێژووییەوە لە شارۆچکە دیوارداری سەردەمی بۆرنزەوە گەشەی کرد و نزیکەی 300 پ.ز. ناوی پاشایەتی وەرگرت، دوای ئەوەی یان ئەوەی کرد.","Wiman Joseon":"ویمان، پەنابەرێکی یان، متمانەی پاشا جونی بەدەست هێنا، پاشان لە 194 پ.ز. لە تەختی دەرکرد. لەگەڵ پەنابەرانی یان و سەرکردە ناوخۆییەکان حوکمی کرد.","Han commanderies":"دوای شکستهێنانی ویمان لە 108 پ.ز.، هان خاکەکەی کرد بە چوار فەرماندەیی. یاخیبوونەکان تەنها نانگنانگیان بۆ هێشتەوە تا 75 پ.ز.","Jin":"یەکێتییەکی باشووریی سەرکردەکان کە بازرگانییان لەگەڵ گۆجۆسۆن دەکرد. نوخبەکانی و پەنابەرەکانی بوونە بنەمای سامهانی دواتر.","Mahan":"نزیکەی 54 دەوڵەتی شارۆچکەی دیواردار، کە پاشای جین لە مۆکجی سەرۆکایەتی دەکرد. بەکجە وەک یەکێک لەوان دەستی پێکرد.","Jinhan":"دوازدە دەوڵەت. نەریت دەڵێت پەنابەرانی ئۆردووگاکانی کاری زۆرەملێی قین لێرە نیشتەجێ بوون. ساڕۆ، یەکێک لەوان، بوو بە سیلا.","Byeonhan":"دوازدە دەوڵەت لەسەر کەناراوی باشووری دەوڵەمەند بە ئاسن. بوون بە یەکێتیی گایا.","Gaya":"نەریت دەڵێت شەش هێلکەی زێڕین لە ئاسمانەوە کەوتنە خوارەوە و سورۆ لە گیمهە لە هێلکەکە هاتە دەرەوە و لە 42 ز. گایای گیمگوانی دامەزراند. برایانی ئەوانی تری گایایان بەڕێوە برد. ئاسن و بازرگانی دەریایی کۆیان کردنەوە.","Buyeo":"نەریت هەیمۆسو، فەرمانڕەوایەکی لە ئاسمانەوە هاتوو، بە ڕەگی ناودەبات. دەوڵەتەکە بە ساچولدۆ پێکەوە مایەوە: پاشا ناوەند حوکم دەکرد و چوار سەرکردە، ماگا (ئەسپ)، ئوگا (گا)، جۆگا (بەراز) و گوگا (سەگ)، ناوچە دەرەکییەکانیان بەڕێوە دەبرد.","Okjeo":"سەرکردایەتییە بچووکەکان بە سەرکردە ناوخۆییەکان. باجیان دەدا بە گۆگوریۆ، کە فەرمانبەری لەنێویان دادەنا.","Dongye":"گوندی تیرەیی، هەر یەکێک بە پیرێکی خۆیان، بەبێ پاشایەکی تاک. گۆگوریۆ و دواتر سیلا تواندنیانەوە.","Goguryeo":"جۆمۆنگ بویۆی بەجێهێشت و گەیشتە جۆلبۆن، لێرە سۆسۆنۆی کچی سەرکردە یۆن تابال شووی پێکرد و پشتگیری کرد. لە 37 پ.ز. گۆگوریۆی دامەزراند و پێنج تیرەی لەژێر تیرەی گیەرو یەکخست.","Baekje":"ئۆنجۆ، کوڕی جۆمۆنگ، لە 18 پ.ز. لەگەڵ دە وەزیر شوێنکەوتووانی بۆ ڕووباری هان برد و ویریەسۆنگی دامەزراند (سەرەتا بە سیپجە ناسرا). دەوڵەتەکانی ماهانی تواندەوە.","Silla":"شەش گوندی ساڕۆ، پارک هیۆکگۆسێ، کە دەگوترێت لە هێلکەیەکەوە هاتووە، لە 57 پ.ز. کردیان بە پاشا. تیرەکانی سۆک و کیم دواتر بوونە بەشێک لە تەخت.","Balhae":"دوای کەوتنی گۆگوریۆ، دە جۆیۆنگ ئاوارەکانی گۆگوریۆ و تیرەکانی مۆهەی کۆکردەوە، لە تیانمێن شکستی بە تانگ هێنا و لە 698 دەوڵەتەکەی دامەزراند.","Later Baekje":"گیۆن هوان، فەرماندەیەکی سیلا، لە باشووری ڕۆژئاوا یاخی بوو و لە 900 بەکجەی دواتری ڕاگەیاند.","Taebong":"گونگیە، شازادەیەکی سیلا کە بوو بە یاخی، سۆنگاک و چۆروۆنی گرت و لە 901 گۆگوریۆی دواتری ڕاگەیاند.","Goryeo":"وانگ گۆن، بازرگانی خاوەن زەوی لە سۆنگاک، خزمەتی گونگیەی کرد، پاشان لە 918 لەگەڵ سەرکردە ناوچەییەکانی تر جێگەی گرتەوە. لە 935 سیلا و لە 936 بەکجەی دواتری گرت.","Tamna":"نەریت دەڵێت سێ پیاو، گۆ، بو و یانگ، لە ئەشکەوتی سامسۆنگهیۆڵ لە جێجو هاتنە دەرەوە و پادشایەتییەکەیان دامەزراند.","Joseon":"یی سۆنگگیە لە 1388 لە ویهواندۆ سوپاکەی گەڕاندەوە، دەسەڵاتی گرتە دەست و لە 1392 تاجی لەسەر نرا. جۆنگ دۆجۆن دەوڵەتە نوێیەکەی کۆنفوشیۆسی نەخشەکێشا.","Korean Empire":"دوای کوشتنی شاژن مین لە 1895، پاشا گۆجۆنگ لە باڵیۆزخانەی ڕووسیا پەنای برد، پاشان لە 1897 ئیمپراتۆریەتی کۆریای ڕاگەیاند بۆ دووپاتکردنەوەی سەربەخۆیی لە چینگ و ئەوانی تر.","Japanese rule":"ژاپۆن لە 1905 جەنگی ڕووسیا-ژاپۆنی بردەوە، کۆریای کرد بە پارێزراو و لە 1910 هەڵیلووشی. بزووتنەوەی یەکی ئادار (1919) و حکومەتی کاتی لە شانگهای ڕێبەرایەتی بەرگریان کرد.","Soviet zone":"هێزەکانی سۆڤیەت لە ئابی 1945 باکووریان داگیرکرد و پشتگیری بەڕێوەبەرایەتی کۆمۆنیستی کیم ئیل سۆنگیان کرد.","US zone":"هێزەکانی ئەمریکا لە ئەیلوولی 1945 باشووریان لەسەر هێڵی 38 داگیرکرد و حکومەتێکی سەربازییان بەڕێوە برد.","South Korea":"هەڵبژاردنێکی پشتگیریکراوی نەتەوە یەکگرتووەکان لە 1948 کۆماری کۆریای بە سەرۆکایەتی سینگمان ڕی دروستکرد. بە خێرایی پیشەسازی بوو و لە 1987 دیموکراتی بوو.","North Korea":"کۆماری دیموکراتی گەلی کۆریا لە ئەیلوولی 1948 لە باکووری داگیرکراوی سۆڤیەت بە سەرۆکایەتی کیم ئیل سۆنگ ڕاگەیەنرا."};

ەی چۆروۆن.","Goryeo":"وانگ گۆن لە 918 دایمەزراند و لە 936 دوورگەکەی یەکخستەوە. سەرکەوتنی گانگ گامچان لە گویجو (1019) سنووری باکووری پاراست.","Tamna":"شانشینی جێجو. باجی دەدا بە بەکجە، سیلا و گۆریۆ، و گۆریۆ لە 1105 کردی بە ناحیە. لەژێر یوانی مەغۆڵ (1273–1367) جێجو بنکەی بەخێوکردنی ئەسپ بوو.","Joseon":"یی سۆنگگیە لە 1392 دایمەزراند؛ پایتەخت هانیانگ. قەڵاکانی سێجۆنگ لە 1430 و 1440ەکان سنووری یالو–تومێنیان دیاری کرد.","Korean Empire":"ئیمپراتۆریەتی گۆجۆنگ، هەوڵێکی نوێکردنەوە لەژێر فشاری ژاپۆن، ڕووسیا و چین.","Japanese rule":"فەرمانڕەوایی کۆلۆنیاڵیی ئیمپراتۆریەتی ژاپۆن، بە حکومەتی گشتی لە گیۆنگسۆنگ بەڕێوە دەبرا.","Soviet zone":"داگیرکاری سۆڤیەت لە باکووری هێڵی 38.","US zone":"بەڕێوەبەرایەتیی سەربازیی ئەمریکا لە باشووری هێڵی 38.","South Korea":"کۆماری کۆریا، لە 1948 دامەزرا.","North Korea":"کۆماری دیموکراتی گەلی کۆریا، لە 1948 دامەزرا."};
